media:
  - name: images
    label: Images produits
    input: assets/images
    output: /assets/images
    rename: safe
    extensions:
      - png
      - jpg
      - jpeg
      - webp

  - name: models
    label: Fichiers 3D
    input: assets/3d
    output: /assets/3d
    rename: safe
    extensions:
      - glb
      - gltf

content:
  - name: products
    label: Produits
    type: file
    path: data/products.json
    format: json

    fields:
      - name: products
        label: Liste des produits
        type: object

        list:
          collapsible:
            collapsed: true
            summary: "{name} — {price} €"

        fields:
          - name: id
            label: Identifiant
            type: string
            required: true

          - name: name
            label: Nom
            type: string
            required: true

          - name: price
            label: Prix
            type: number
            required: true
            options:
              min: 0
              step: 0.01

          - name: category
            label: Catégorie
            type: string
            required: true

          - name: image
            label: Photo principale
            type: image
            required: true
            options:
              media: images

          - name: short
            label: Description courte
            type: text
            required: true

          - name: features
            label: Caractéristiques
            type: string
            list: true

          - name: stock
            label: Stock
            type: number
            required: true
            options:
              min: 0
              step: 1

          - name: visible
            label: Visible sur la boutique
            type: boolean

          - name: model3d
            label: Modèle 3D
            type: file
            required: false
            options:
              media: models