backend:
  name: github
  repo: Nabix602/send-labs-site
  branch: main
  base_url: https://VOTRE-SERVICE-OAUTH.example
  auth_endpoint: auth

locale: fr
media_folder: assets/images
public_folder: /assets/images
publish_mode: simple

collections:
  - name: catalogue
    label: Catalogue
    files:
      - name: produits
        label: Produits
        file: data/products.json
        format: json
        fields:
          - label: Produits
            name: products
            widget: list
            summary: "{{fields.name}} — {{fields.price}} €"
            fields:
              - { label: Identifiant, name: id, widget: string, hint: "Unique, sans espace, ex. garde-boue" }
              - { label: Nom, name: name, widget: string }
              - { label: Prix, name: price, widget: number, value_type: float, min: 0, step: 0.01 }
              - { label: Catégorie, name: category, widget: string }
              - { label: Photo, name: image, widget: image, choose_url: false }
              - { label: Description courte, name: short, widget: text }
              - label: Caractéristiques
                name: features
                widget: list
                field: { label: Caractéristique, name: item, widget: string }
              - { label: Stock, name: stock, widget: number, value_type: int, min: 0 }
              - { label: Visible, name: visible, widget: boolean, default: true }
              - { label: Modèle 3D, name: model3d, widget: file, required: false, media_folder: /assets/3d, public_folder: /assets/3d }
